name: Build and Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Show tool versions
        shell: powershell
        run: |
          stack --version
          ghc --version

      - name: Build executable
        shell: powershell
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .\release

      - name: Copy assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\release\assets | Out-Null
          Copy-Item -Recurse -Force .\assets\pieces .\release\assets\

      - name: Copy runtime DLLs if present
        shell: powershell
        run: |
          $exe = Get-ChildItem .\release\*.exe | Select-Object -First 1
          if (-not $exe) {
            throw "Executable was not found in .\release"
          }

          $ghcDir = Split-Path (Get-Command ghc).Source -Parent
          $mingwBin = Join-Path $ghcDir "..\..\mingw\bin"
          $mingwBin = [System.IO.Path]::GetFullPath($mingwBin)

          if (Test-Path $mingwBin) {
            Get-ChildItem $mingwBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName .\release\ -Force
            }
          }

      - name: Create zip archive
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "haskell-chess-$tag-windows.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path .\release\* -DestinationPath $archive

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: haskell-chess-windows
          path: haskell-chess-*.zip

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: haskell-chess-*.zip
          generateReleaseNotes: true
          allowUpdates: true
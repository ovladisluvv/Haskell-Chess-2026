name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        shell: powershell
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .\release

      - name: Copy assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\release\assets | Out-Null
          Copy-Item -Recurse -Force .\assets\pieces .\release\assets\

      - name: Copy runtime DLLs if present
        shell: powershell
        run: |
          $ghcDir = Split-Path (Get-Command ghc).Source -Parent
          $mingwBin = Join-Path $ghcDir "..\..\mingw\bin"
          $mingwBin = [System.IO.Path]::GetFullPath($mingwBin)

          if (Test-Path $mingwBin) {
            Get-ChildItem $mingwBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName .\release\ -Force
            }
          }

      - name: Pack Windows release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "haskell-chess-$tag-windows.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path .\release\* -DestinationPath $archive

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: haskell-chess-*-windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack Linux release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-linux.tar.gz" -C ./release .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: haskell-chess-*-linux.tar.gz

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack macOS ARM64 release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-macos-arm64.tar.gz" -C ./release .

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: haskell-chess-*-macos-arm64.tar.gz

  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack macOS Intel release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-macos-intel.tar.gz" -C ./release .

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-release
          path: haskell-chess-*-macos-intel.tar.gz

  publish:
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload labeled assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" \
            dist/windows-release/haskell-chess-${TAG}-windows.zip#Windows\ \(x64\) \
            --clobber

          gh release upload "$TAG" \
            dist/linux-release/haskell-chess-${TAG}-linux.tar.gz#Linux\ \(x64\) \
            --clobber

          gh release upload "$TAG" \
            dist/macos-arm64-release/haskell-chess-${TAG}-macos-arm64.tar.gz#macOS\ \(Apple\ Silicon,\ arm64\) \
            --clobber

          gh release upload "$TAG" \
            dist/macos-intel-release/haskell-chess-${TAG}-macos-intel.tar.gz#macOS\ \(Intel,\ x64\) \
            --clobber

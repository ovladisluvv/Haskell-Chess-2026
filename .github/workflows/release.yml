name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Set up MSYS2 and install freeglut
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-freeglut

      - name: Build executable
        shell: powershell
        run: |
          stack setup
          stack build --copy-bins --local-bin-path .\release

      - name: Copy assets
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\release\assets | Out-Null
          Copy-Item -Recurse -Force .\assets\pieces .\release\assets\

      - name: Set up MSYS2 and install freeglut
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libwinpthread-git
            mingw-w64-x86_64-freeglut
            $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
            $msys2Bin = Join-Path $msys2 "mingw64\bin"

            $stackCompilerBin = (& stack path --compiler-bin).Trim()
            $stackCompilerToolsBin = (& stack path --compiler-tools-bin).Trim()

            $candidateDirs = @(
              $msys2Bin,
              $stackCompilerToolsBin,
              $stackCompilerBin
            ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

      - name: Copy Windows runtime DLLs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path .\release | Out-Null

          $msys2 = "${{ steps.msys2.outputs.msys2-location }}"
          $stackCompilerBin = (& stack path --compiler-bin).Trim()
          $stackCompilerToolsBin = (& stack path --compiler-tools-bin).Trim()
          $msys2Bin = Join-Path $msys2 "mingw64\bin"

          $candidateDirs = @(
            $stackCompilerToolsBin,
            $stackCompilerBin,
            $msys2Bin
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          Write-Host "Candidate DLL directories:"
          $candidateDirs | ForEach-Object { Write-Host "  $_" }

          $dlls = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll",
            "libfreeglut.dll",
            "freeglut.dll",
            "glut32.dll"
          )

          $copied = @()

          foreach ($name in $dlls) {
            $found = $null

            foreach ($dir in $candidateDirs) {
              $src = Join-Path $dir $name
              if (Test-Path $src) {
                $found = $src
                break
              }
            }

            if ($found) {
              Copy-Item $found .\release\ -Force
              $copied += $name
            }
          }

          if (($copied -notcontains "glut32.dll") -and (Test-Path .\release\libfreeglut.dll)) {
            Copy-Item .\release\libfreeglut.dll .\release\glut32.dll -Force
            $copied += "glut32.dll"
          }

          Write-Host ("Copied DLLs: " + ($copied -join ", "))

          $required = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll"
          )

          foreach ($name in $required) {
            $path = Join-Path .\release $name
            if (-not (Test-Path $path)) {
              throw "Missing required runtime DLL after search: $path"
            }
          }

          $hasGlut =
            (Test-Path .\release\libfreeglut.dll) -or
            (Test-Path .\release\freeglut.dll) -or
            (Test-Path .\release\glut32.dll)

          if (-not $hasGlut) {
            throw "No GLUT runtime DLL found in release bundle"
          }

      - name: Smoke test packaged executable
        shell: powershell
        run: |
          $exe = Get-ChildItem .\release\*.exe | Select-Object -First 1

          if (-not $exe) {
            throw "No executable found in .\release"
          }

          $proc = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 5
          $proc.Refresh()

          if ($proc.HasExited) {
            throw "Packaged executable exited immediately with code $($proc.ExitCode). Most likely a missing DLL or runtime asset."
          }

          Stop-Process -Id $proc.Id -Force

      - name: Pack Windows release
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "haskell-chess-$tag-windows.zip"
          if (Test-Path $archive) { Remove-Item $archive -Force }
          Compress-Archive -Path .\release\* -DestinationPath $archive

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: haskell-chess-*-windows.zip

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libglfw3-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack Linux release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-linux.tar.gz" -C ./release .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: haskell-chess-*-linux.tar.gz

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack macOS ARM64 release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-macos-arm64.tar.gz" -C ./release .

      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: haskell-chess-*-macos-arm64.tar.gz

  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest

      - name: Build executable
        run: |
          stack setup
          stack build --copy-bins --local-bin-path ./release

      - name: Copy assets
        run: |
          mkdir -p ./release/assets
          cp -r ./assets/pieces ./release/assets/

      - name: Pack macOS Intel release
        run: |
          chmod +x ./release/chess-exe || true
          TAG="${GITHUB_REF_NAME}"
          tar -czf "haskell-chess-${TAG}-macos-intel.tar.gz" -C ./release .

      - name: Upload macOS Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-release
          path: haskell-chess-*-macos-intel.tar.gz

  publish:
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-intel]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --title "$TAG" --generate-notes

      - name: Upload labeled assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" \
            dist/windows-release/haskell-chess-${TAG}-windows.zip#Windows\ \(x64\) \
            --clobber

          gh release upload "$TAG" \
            dist/linux-release/haskell-chess-${TAG}-linux.tar.gz#Linux\ \(x64\) \
            --clobber

          gh release upload "$TAG" \
            dist/macos-arm64-release/haskell-chess-${TAG}-macos-arm64.tar.gz#macOS\ \(Apple\ Silicon,\ arm64\) \
            --clobber

          gh release upload "$TAG" \
            dist/macos-intel-release/haskell-chess-${TAG}-macos-intel.tar.gz#macOS\ \(Intel,\ x64\) \
            --clobber
